<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Eliot glitch hacker banner</title>
  <desc id="desc">Dark cyber banner with a glitch-styled Eliot wordmark and a terminal prompt.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04060B"/>
      <stop offset="0.5" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>

    <linearGradient id="edgeGlow" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF2A6D" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#00E5FF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.85"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#13203A" stroke-width="1"/>
    </pattern>

    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="#07101A" opacity="0.32"/>
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00E5FF" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#FF2A6D" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" stroke="url(#edgeGlow)" stroke-opacity="0.5"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)" opacity="0.42"/>
  <rect width="1200" height="320" rx="24" fill="url(#scanlines)" opacity="0.28"/>

  <g opacity="0.75">
    <rect x="0" y="34" width="1200" height="2" fill="url(#edgeGlow)" opacity="0.28"/>
    <rect x="0" y="278" width="1200" height="2" fill="url(#edgeGlow)" opacity="0.2"/>
  </g>

  <g opacity="0.8">
    <rect x="84" y="78" width="1030" height="3" rx="1.5" fill="#FF2A6D" opacity="0.22">
      <animate attributeName="opacity" dur="3.1s" repeatCount="indefinite" values="0.22;0.10;0.25;0.18;0.22"/>
      <animate attributeName="x" dur="5.2s" repeatCount="indefinite" values="84;112;92;84"/>
    </rect>
    <rect x="650" y="104" width="190" height="5" rx="2.5" fill="#00E5FF" opacity="0.18">
      <animate attributeName="x" dur="4.4s" repeatCount="indefinite" values="650;688;660;650"/>
      <animate attributeName="opacity" dur="2.2s" repeatCount="indefinite" values="0.18;0.34;0.14;0.18"/>
    </rect>
    <rect x="320" y="204" width="260" height="4" rx="2" fill="#8B5CF6" opacity="0.16">
      <animate attributeName="x" dur="6s" repeatCount="indefinite" values="320;350;328;320"/>
      <animate attributeName="opacity" dur="2.8s" repeatCount="indefinite" values="0.16;0.28;0.1;0.16"/>
    </rect>
  </g>

  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="800" font-size="94" letter-spacing="4" filter="url(#textGlow)">
    <text x="95" y="162" fill="#FF2A6D" opacity="0.34">ELIOT
      <animate attributeName="x" dur="3.8s" repeatCount="indefinite" values="95;90;96;95"/>
      <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite" values="0.34;0.14;0.38;0.34"/>
    </text>
    <text x="107" y="162" fill="#00E5FF" opacity="0.38">ELIOT
      <animate attributeName="x" dur="4.2s" repeatCount="indefinite" values="107;111;105;107"/>
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.38;0.18;0.42;0.38"/>
    </text>
    <text x="100" y="162" fill="#F8FAFC">ELIOT</text>
  </g>

  <text x="103" y="208" fill="#9FB3C8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="23" letter-spacing="0.3">
    Production-focused engineer working across FastAPI, Flutter, Rust, and AI.
  </text>

  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" font-weight="600">
    <rect x="852" y="68" width="104" height="34" rx="17" fill="#0F172A" stroke="#FF2A6D" stroke-opacity="0.55"/>
    <text x="875" y="90" fill="#FFD0DF">FASTAPI</text>

    <rect x="968" y="68" width="104" height="34" rx="17" fill="#0F172A" stroke="#00E5FF" stroke-opacity="0.55"/>
    <text x="992" y="90" fill="#C7F7FF">FLUTTER</text>

    <rect x="852" y="114" width="104" height="34" rx="17" fill="#0F172A" stroke="#8B5CF6" stroke-opacity="0.55"/>
    <text x="884" y="136" fill="#E2D6FF">RUST</text>

    <rect x="968" y="114" width="104" height="34" rx="17" fill="#0F172A" stroke="#22C55E" stroke-opacity="0.55"/>
    <text x="1004" y="136" fill="#D6FFE5">AI</text>
  </g>

  <g>
    <rect x="86" y="238" width="490" height="46" rx="12" fill="#070C16" stroke="#1E293B"/>
    <circle cx="118" cy="261" r="5" fill="#FF5F56"/>
    <circle cx="138" cy="261" r="5" fill="#FFBD2E"/>
    <circle cx="158" cy="261" r="5" fill="#27C93F"/>
    <text x="185" y="267" fill="#C7D2E0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="20">
      &gt; building real systems<span>_</span>
    </text>
    <rect x="470" y="247" width="10" height="18" fill="#00E5FF" opacity="0.88">
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="0.88;0;0.88"/>
    </rect>
  </g>
</svg>
